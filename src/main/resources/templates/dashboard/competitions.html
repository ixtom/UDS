<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Competitions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/dashboard-layout :: layout(~{dashboard/sidebar :: sidebar}, ~{::content})}">
        <section th:fragment="content">
            <h1>Competitions</h1>
            <table>
               <thead>
                   <tr>
                       <td>Competition</td>
                       <td>Duelist</td>
                       <td>Status</td>
                   </tr>
               </thead>
               <tbody>
                   <tr th:if="${#lists.isEmpty(entries)}">
                       <td colspan="3">You haven't participated in any competitions yet</td>
                   </tr>
                   <tr th:each="entry: ${entries}">
                       <td><a th:href="@{/competitions/{id}(id=${entry.competition.id})}" th:text="${entry.competition.title}"></a></td>
                       <td><a th:href="@{/duelist/{id}(id=${entry.duelist.id})}" th:text="${entry.duelist.name}"></a></td>
                       <td><!--Upcoming, Round X, Eliminated, Winner--></td>
                   </tr>
               </tbody>
            </table>
        </section>
    </div>
</body>
</html>
