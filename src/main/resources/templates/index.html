<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>
<body>
    index

    <div th:if="${currentUser != null}">
        <form th:action="@{/logout}" method="post">
            <input type="submit" value="logout" />
        </form>
        <a th:if="${currentUser.hasRole('ADMIN')}" href="/admin/users">View registered users</a><br>
        <a href="/dashboard">Dashboard</a>
        <a th:href="@{/account/profile/edit}">Edit Profile</a>
        <a href="/change-password">Change password</a>
        <a href="/link/discord" th:if="${!currentUser.isProviderLinked('discord')}">Link Discord</a>
        <a href="/upload">Upload new duel</a>
    </div>
    <a th:if="${currentUser == null}" href="/login">Login</a>
    <a th:href="@{/competitions}">View Competitions</a>

    <div>
        <div th:each="duel: ${duels}">
            <a th:href="@{/duelpage/{id}(id=${duel.id})}" th:text="${duel.getDefaultTitle}"></a>
            <br>
        </div>
    </div>
</body>
</html>
