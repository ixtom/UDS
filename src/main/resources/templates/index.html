<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>
<body>
    index

    <div th:if="${user != null}">
        <form th:action="@{/logout}" method="post">
            <input type="submit" value="logout" />
        </form>
        <a href="/upload">Upload new duel</a>
    </div>
    <a th:if="${user == null}" href="/login">Login</a>

    <div>
        <tr th:each="duel: ${duels}">
            <a th:href="@{/duelpage/{id}(id=${duel.id})}" th:text="${duel.getDefaultTitle}"></a>
            <br>
        </tr>
    </div>
</body>
</html>
