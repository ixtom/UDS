<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Duel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>
<body>
    <form th:action="@{/upload}" th:object="${newduel}" method="post">
    <div class="mb-3">
        <label for="url1" class="form-label">Enter YouTube URL</label>
        <input type="text" th:field="*{url1}" class="form-control-sm" placeholder="Youtube URL" required>
        <span th:if="${#fields.hasErrors('url1')}" th:errors="*{url1}"></span>
    </div>
    <div class="mb-3">
        <label for="url2" class="form-label">Enter YouTube URL</label>
        <input type="text" th:field="*{url2}" class="form-control-sm" placeholder="Youtube URL" required>
        <span th:if="${#fields.hasErrors('url2')}" th:errors="*{url2}"></span>
    </div>
    <div class="mb-3">
        <label for="round" class="form-label">Enter Round Number</label>
        <input type="text" th:field="*{round}" class="form-control-sm" required>
        <span th:if="${#fields.hasErrors('round')}" th:errors="*{round}"></span>
    </div>
    <div class="mb-3">
        <label for="description" class="form-label">Enter Duel Description</label>
        <textarea th:field="*{description}" rows="10" maxlength="5000" class="form-control" placeholder="Description"></textarea>
        <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
    </div>
    <button type="submit" class="btn btn-primary">Upload</button>
</form>

</body>
</html>
