<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
    <div th:replace="~{fragments/cf :: turnstile-head}"></div>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <form th:action="@{''}" th:object="${oauthRegisterRequest}" method="post">
        <div th:if="${#fields.hasErrors('global')}">
            <p th:each="err : ${#fields.errors('global')}" th:text="${err}"></p>
            <br />
        </div>

        <label for="email">Email</label>
        <input type="email" th:field="*{email}" required/>
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        <br />

        <label for="username">Username</label>
        <input type="text" th:field="*{username}" minlength="2" maxlength="25" />
        <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        <br />

        <div th:replace="~{fragments/cf :: turnstile}"></div>

        <input type="submit" value="Register" disabled />
    </form>
</body>
</html>
