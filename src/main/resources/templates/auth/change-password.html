<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change password</title>
</head>
<body>
    <h1>Change password</h1>
    <p th:if="${error}" th:text="${error}" role="alert"></p>
    <form th:action="@{/change-password}" th:object="${changePasswordRequest}" method="post">

        <label for="currentPassword">Current password</label>
        <input type="password" th:field="*{currentPassword}" autocomplete="current-password" required />
        <span th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
        <br />
        <label for="newPassword">New password</label>
        <input type="password" th:field="*{newPassword}" autocomplete="new-password" minlength="8" required />
        <span th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
        <br />
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" th:field="*{confirmPassword}" autocomplete="new-password" minlength="8" required />
        <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
        <br />
        <button type="submit">Change password</button>
    </form>
    <a href="/">Cancel</a>
</body>
</html>
