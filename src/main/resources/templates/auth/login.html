<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" />
    <div th:replace="~{fragments/cf :: turnstile-head}"></div>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <!--TODO: make this unnecessary-->
    <p th:if="${param.passwordChanged}" role="status">Password changed. Please sign in with your new password.</p>

    <form th:action="@{/login}" th:object="${loginRequest}" method="post">
        <div th:if="${#fields.hasErrors('global')}">
            <p th:each="err : ${#fields.errors('global')}" th:text="${err}"></p>
            <br />
        </div>

        <label for="email">Email</label>
        <input type="email" th:field="*{email}" required />
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        <br />

        <label for="password">Password</label>
        <input type="password" th:field="*{password}" />
        <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        <br />

        <div th:replace="~{fragments/cf :: turnstile}"></div>

        <input type="submit" disabled />
    </form>
    <a href="/register">Register here</a>
</body>
</html>
