<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit duel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>
<body>
    <form th:action="@{''}" th:object="${editDuelRequest}" method="post">
        <div class="mb-3">
            <label for="video" class="form-label">YouTube URL</label>
            <input type="text" th:field="*{video}" class="form-control-sm">
            <span th:if="${#fields.hasErrors('video')}" th:errors="*{video}"></span>
        </div>
        <hr>
        <h2>Shared data</h2>
        <div class="mb-3">
            <button type="button" id="upload_widget" class="btn btn-secondary btn-sm">Upload Banner Image</button>
            <input type="hidden" id="duelbanner" th:field="*{banner}">
            <span th:if="${#fields.hasErrors('banner')}" th:errors="*{banner}"></span>
            <img id="duelbanner_preview" th:src="${editDuelRequest.banner}"
                 th:style="${editDuelRequest.banner == null ? 'display: none;' : 'display: block;'}"
                 style="max-width: 100%; height: auto;">
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Enter Duel Description</label>
            <textarea th:field="*{description}" rows="10" maxlength="5000" class="form-control" placeholder="Description"></textarea>
            <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
        </div>
        <button type="submit" class="btn btn-primary">Upload</button>
    </form>
    <script src="https://upload-widget.cloudinary.com/latest/global/all.js" type="text/javascript"></script>
    <script th:src="@{/js/uploadimage.js}" src="/js/uploadimage.js"></script>
</body>
</html>
