<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main>
        <header>
            <h1 th:text="${duel.defaultTitle}">Duel Title</h1>
        </header>
        <!-- BANNER HERE!!!! -->
         <img th:if="${duel?.duelBanner != null}" th:src="${duel.duelBanner}" alt = "Duel Banner"
         style="width: 100%; max-width: 1584px; aspect-ratio: 4 / 1; object-fit: cover; display: block;">
        <section class="description" th:if="${duel.description != null}">
            <h2>Description</h2>
            <p th:text="${duel.description}">Backstory goes here</p>
        </section>

        <section class="matchup">
            <article class="competitor competitor-1">
                <h2>Competitor 1</h2>
                <p>Animator: <span th:text="${duel.user1?.username}">TBD</span></p>
                <p>Duelist: <span th:text="${duel.duelist1?.name}">TBD</span></p>
            </article>
            <article class="competitor competitor-2">
                <h2>Competitor 2</h2>
                <p>Animator: <span th:text="${duel.user2?.username}">TBD</span></p>
                <p>Duelist: <span th:text="${duel.duelist2?.name}">TBD</span></p>
            </article>
        </section>

        <section class="animations" th:if="${!#strings.isEmpty(duel.videoid1) or !#strings.isEmpty(duel.videoid2)}">
            <h2>Animations</h2>
            <iframe th:if="${!#strings.isEmpty(duel.videoid1)}" width="420" height="345"
                    th:src="|https://www.youtube-nocookie.com/embed/${duel.videoid1}|"></iframe>
            <iframe th:if="${!#strings.isEmpty(duel.videoid2)}" width="420" height="345"
                    th:src="|https://www.youtube-nocookie.com/embed/${duel.videoid2}|"></iframe>
        </section>
        <section class="voting">
            <p>Category 1</p>
            <div th:if="${currentUser != null}">
                <form th:action="@{/duelpage/{id}(id=${duel.id})}"
                    th:object="${voteRequest}" method="post">
                    <select th:field="*{cat1winner}">
                        <option th:if="${duel.duelist1 != null}"
                                th:value="${duel.duelist1?.id}"
                                th:text="${duel.duelist1?.name}"></option>
                        <option th:if="${duel.duelist2 != null}"
                                th:value="${duel.duelist2?.id}"
                                th:text="${duel.duelist2?.name}"></option>
                    </select>
                    <button type="submit">Vote</button>
                </form>
            </div>
            <p th:unless="${currentUser != null}">
                <a th:href="@{/login}">Log in to vote</a>
            </p>
            <p> <span th:text="${duel.duelist1?.name}"></span>
                <span th:text="${d1Cat1Votes}"></span>
            </p>
             <p> <span th:text="${duel.duelist2?.name}"></span>
                <span th:text="${d2Cat1Votes}"></span>
            </p>
        </section>
    </main>
</body>
</html>
