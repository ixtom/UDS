<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin dashboard | UDS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container pb-4">
        <h1 class="mb-3">Admin dashboard</h1>
        <div class="mb-4">
            <a class="btn btn-primary mr-2 mb-2" th:href="@{/admin/competitions/new}">Create new competition</a>
            <a class="btn btn-outline-primary mb-2" th:href="@{/admin/users}">View registered users</a>
        </div>

        <section aria-labelledby="manage-competitions-heading">
            <h2 id="manage-competitions-heading" class="h4">Manage competitions</h2>
            <p th:if="${competitions.isEmpty()}">No competitions yet.</p>
            <ul class="list-group" th:unless="${competitions.isEmpty()}">
                <li class="list-group-item d-flex flex-wrap justify-content-between align-items-baseline"
                    th:each="competition : ${competitions}">
                    <a class="mr-3" th:href="@{/admin/competitions/{id}(id=${competition.id})}"
                       th:text="${competition.title}"></a>
                    <time class="convert-to-local-date-and-time text-muted" th:if="${competition.start != null}"
                          th:datetime="${competition.start}" th:text="${competition.start}"></time>
                    <span class="text-muted" th:if="${competition.start == null}">Start date unavailable</span>
                </li>
            </ul>
        </section>
    </main>
    <script th:src="@{/js/localdate.js}"></script>
</body>
</html>
