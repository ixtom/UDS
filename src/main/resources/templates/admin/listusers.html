<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>
<body>
    <table>
        <tr>
            <td>Id</td>
            <td>Username</td>
            <td>Role</td>
            <td>Connected Accounts</td>
            <td>Created</td>
        </tr>
        <tr th:each="userProfile : ${userProfiles}">
            <!--TODO: link to profile-->
            <td th:text="${userProfile.id}"></td>
            <td th:text="${userProfile.username}"></td>
            <td th:text="${userProfile.userAuth.role}"></td>
            <td>
                <img th:each="link : ${userProfile.userAuth.accountLinks}"
                     th:src="@{/images/{name}.svg(name=${link.id.provider})}"
                     th:title="${link.id.provider}"
                />
            </td>
            <td>
                <time class="convert-to-local-date" th:datetime="${userProfile.userAuth.createdAt}"></time>
            </td>
        </tr>
    </table>

    <script>
    document.querySelectorAll(".convert-to-local-date").forEach((element) => {
      element.textContent = new Intl.DateTimeFormat(undefined, {
        month: "short",
        day: "numeric",
        year: "numeric",
      }).format(new Date(element.dateTime));
    });
    </script>
    </body>
</html>
