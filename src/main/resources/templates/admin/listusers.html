<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>
<body>
    <table>
        <tr>
            <td>Id</td>
            <td>Username</td>
            <td>Role</td>
            <td>Discord linked</td>
            <td>Created</td>
        </tr>
        <tr th:each="userProfile : ${userProfiles}">
            <td th:text="${userProfile.id}"></td>
            <td>
                <a th:href="@{/profile/{username}(username=${userProfile.username})}"
                   th:text="${userProfile.username}"></a>
            </td>
            <td th:text="${userProfile.userAuth.role}"></td>
            <td>
                <svg th:if="${userProfile.userAuth.discordId != null}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
                    <path fill="#22C55E" d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"></path>
                </svg>
                <svg th:if="${userProfile.userAuth.discordId == null}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
                    <path fill="#EF4444" d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"></path>
                </svg>
            </td>
            <td>
                <time class="convert-to-local-date" th:datetime="${userProfile.userAuth.createdAt}"></time>
            </td>
        </tr>
    </table>

    <script>
    document.querySelectorAll(".convert-to-local-date").forEach((element) => {
      element.textContent = new Intl.DateTimeFormat(undefined, {
        month: "short",
        day: "numeric",
        year: "numeric",
      }).format(new Date(element.dateTime));
    });
    </script>
    </body>
</html>
