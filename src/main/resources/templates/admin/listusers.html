<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List Users</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <table>
        <tr>
            <td>Id</td>
            <td>Username</td>
            <td>Role</td>
            <td>Connected Accounts</td>
            <td>Created</td>
        </tr>
        <tr th:each="userProfile : ${userProfiles}">
            <td th:text="${userProfile.id}"></td>
            <td>
                <a th:href="@{/profile/{username}(username=${userProfile.username})}"
                   th:text="${userProfile.username}"></a>
            </td>
            <td th:text="${userProfile.userAuth.role}"></td>
            <td>
                <img th:each="link : ${userProfile.userAuth.accountLinks}"
                     th:src="@{/images/{name}.svg(name=${link.id.provider})}"
                     th:title="${link.id.provider}"
                />
            </td>
            <td>
                <time class="convert-to-local-date" th:datetime="${userProfile.userAuth.createdAt}"></time>
            </td>
        </tr>
    </table>

    <script>
    document.querySelectorAll(".convert-to-local-date").forEach((element) => {
      element.textContent = new Intl.DateTimeFormat(undefined, {
        month: "short",
        day: "numeric",
        year: "numeric",
      }).format(new Date(element.dateTime));
    });
    </script>
    </body>
</html>
