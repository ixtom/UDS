<section class="mt-4" aria-labelledby="image-editor-heading"
         th:fragment="editor(title, imageUrl, uploadAction, removeAction)">
    <h2 id="image-editor-heading" th:text="${title}"></h2>
    <p th:if="${imageError != null}" class="alert alert-danger" role="alert" th:text="${imageError}"></p>
    <p th:if="${imageSuccess != null}" class="alert alert-success" role="status" th:text="${imageSuccess}"></p>
    <img th:unless="${#strings.isEmpty(imageUrl)}" th:src="${imageUrl}" th:alt="${title}"
         referrerpolicy="no-referrer" class="d-block img-fluid mb-2" style="max-height: 12rem">

    <form th:action="${uploadAction}" method="post" enctype="multipart/form-data" class="mb-2">
        <div class="form-group">
            <label for="user-image">JPEG or PNG, up to 5 MB and 4096 × 4096 pixels</label>
            <input id="user-image" name="image" type="file" accept="image/jpeg,image/png" class="form-control-file" required>
        </div>
        <button type="submit" class="btn btn-primary"
                th:text="${#strings.isEmpty(imageUrl) ? 'Upload image' : 'Replace image'}"></button>
    </form>

    <form th:unless="${#strings.isEmpty(imageUrl)}" th:action="${removeAction}" method="post">
        <button type="submit" class="btn btn-outline-danger">Remove image</button>
    </form>
</section>
