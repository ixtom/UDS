<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duel</title>
</head>
<body>
    <main>
        <header>
            <h1 th:text="${duel.defaultTitle}">Duel Title</h1>
        </header>
        <!-- BANNER HERE!!!! -->
         <img th:if="${duel?.duelBanner != null}" th:src="${duel.duelBanner}" alt = "Duel Banner"
         style="width: 100%; max-width: 1584px; aspect-ratio: 4 / 1; object-fit: cover; display: block;">
        <section class="description" th:if="${duel.description != null}">
            <h2>Description</h2>
            <p th:text="${duel.description}">Backstory goes here</p>
        </section>

        <section class="matchup">
            <article class="competitor competitor-1">
                <h2>Competitor 1</h2>
                <p>Animator: <span th:text="${duel.user1?.username}">TBD</span></p>
                <p>Duelist: <span th:text="${duel.duelist1?.name}">TBD</span></p>
            </article>
            <article class="competitor competitor-2">
                <h2>Competitor 2</h2>
                <p>Animator: <span th:text="${duel.user2?.username}">TBD</span></p>
                <p>Duelist: <span th:text="${duel.duelist2?.name}">TBD</span></p>
            </article>
        </section>

        <section class="animations" th:if="${duel.videoid1 != null or duel.videoid2 != null}">
            <h2>Animations</h2>
            <iframe th:if="${duel.videoid1 != null}" width="420" height="345"
                    th:src="|https://www.youtube-nocookie.com/embed/${duel.videoid1}|"></iframe>
            <iframe th:if="${duel.videoid2 != null}" width="420" height="345"
                    th:src="|https://www.youtube-nocookie.com/embed/${duel.videoid2}|"></iframe>
        </section>
        <!-- Voting Section!!!
        <section class="voting">
            <h2>Vote</h2>
            <p>Voting coming soon.</p>
        </section>
        -->
    </main>
</body>
</html>
