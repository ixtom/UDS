<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form th:action="@{/duelist/{id}/edit(id=${duelistId})}" th:object="${editDuelistRequest}" method="post">
        <label for="name">Name</label>
        <input type="text" th:field="*{name}" required>
        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        <br>
        <label for="title">Title</label>
        <input type="text" th:field="*{title}">
        <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        <br>
        <label for="demoVideo">Demo Video</label>
        <input type="text" th:field="*{demoVideo}">
        <span th:if="${#fields.hasErrors('demoVideo')}" th:errors="*{demoVideo}"></span>
        <br>
        <label for="description">Description</label>
        <textarea th:field="*{description}" rows="10"></textarea>
        <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
        <br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
