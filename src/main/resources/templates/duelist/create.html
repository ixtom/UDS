<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Duelist</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
    <div th:replace="~{fragments/cf :: turnstile-head}"></div>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <form th:action="@{/duelist/create}" th:object="${createDuelistRequest}" method="post">
        <p th:each="err : ${#fields.errors('global')}" th:text="${err}"></p>
        <label for="name">Name</label>
        <input type="text" th:field="*{name}" required>
        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        <br>
        <label for="title">Title</label>
        <input type="text" th:field="*{title}">
        <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        <br>
        <label for="demoVideo">Demo Video</label>
        <input type="text" th:field="*{demoVideo}">
        <span th:if="${#fields.hasErrors('demoVideo')}" th:errors="*{demoVideo}"></span>
        <br>
        <label for="description">Description</label>
        <textarea th:field="*{description}" rows="5"></textarea>
        <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
        <br>
        <div th:replace="~{fragments/cf :: turnstile}"></div>
        <button type="submit" disabled>Submit</button>
    </form>
</body>
</html>
