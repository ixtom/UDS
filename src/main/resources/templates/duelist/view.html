<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${duelist.name}"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <h1 th:text="${duelist.name}"></h1>
    <p th:if="${!#strings.isEmpty(duelist.title)}" th:text="|&OpenCurlyDoubleQuote;${duelist.title}&CloseCurlyDoubleQuote;|"></p>
    <div>
        <div >
            <div th:with="portrait=${duelist.portraitUrl}">
                <img th:src="${#strings.isEmpty(portrait)} ? @{/images/missing-image.svg} : ${portrait}"
                     th:alt="${#strings.isEmpty(portrait) ? 'Default duelist portrait' : 'Duelist portrait'}"
                     referrerpolicy="no-referrer" width="256" class="img-fluid" style="max-height: 32rem; object-fit: contain">
            </div>

            <p>Created by <a th:href="@{/profile/{username}(username=${duelist.owner.username})}" th:text="${duelist.owner.username}"></a></p>
            <a th:if="${isOwner}" th:href="@{/duelist/{id}/edit(id=${duelist.id})}">Edit Duelist</a>
            <a th:if="${currentUser != null && !isOwner}" th:href="@{/duelist/{id}/challenge(id=${duelist.id})}">Challenge!</a>
        </div>

        <div>
            <div th:if="${!#strings.isEmpty(duelist.demo)}" style="max-width: 50rem;">
                <div th:insert="~{fragments/yt :: embed(videoId=${duelist.demo})}"></div>
            </div>

            <main>
                <h2>Description / Backstory</h2>
                <p th:text="${duelist.description}" style="white-space: pre-line;"></p>

                <section aria-labelledby="duel-history-heading">
                    <h2 id="duel-history-heading">Duels</h2>
                    <p th:if="${duelHistory.isEmpty()}">No duels yet.</p>
                    <ul th:unless="${duelHistory.isEmpty()}">
                        <li th:each="duel : ${duelHistory}"
                            th:with="opponent=${duel.duelist1?.id == duelist.id ? duel.duelist2 : duel.duelist1}">
                            <a th:href="@{/duelpage/{id}(id=${duel.id})}" th:text="${duel.defaultTitle}"></a>
                            <span th:if="${opponent != null and !#strings.isEmpty(duel.title)}"
                                  th:text="| · vs ${opponent.name}|"></span>
                            <span th:if="${duel.competition == null}"> · Standalone duel</span>
                            <span th:if="${duel.competition != null}" th:text="| · ${duel.competition.title}|"></span>
                            <span th:if="${duel.competition != null and duel.roundnum != null and !#strings.isEmpty(duel.title)}"
                                  th:text="|, round ${duel.roundnum}|"></span>
                        </li>
                    </ul>
                </section>

                <section aria-labelledby="competition-history-heading">
                    <h2 id="competition-history-heading">Competitions</h2>
                    <p th:if="${competitionHistory.isEmpty()}">No competitions yet.</p>
                    <ul th:unless="${competitionHistory.isEmpty()}">
                        <li th:each="item : ${competitionHistory}">
                            <a th:href="@{/competitions/{id}(id=${item.competition.id})}"
                               th:text="${item.competition.title}"></a>
                            <span th:text="${item.hasMatchup ? ' · Matchup recorded' : ' · Registered'}"></span>
                        </li>
                    </ul>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
