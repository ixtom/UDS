<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Competition</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <a th:href="@{/competitions}">&larr; All competitions</a>

    <h2 class="mt-3" th:text="${competition.title}"></h2>
    <p>Starts: <time class="convert-to-local-date" th:datetime="${competition.start}"></time></p>

    <h4 class="mt-4">Rounds</h4>
    <p class="text-muted">None yet.</p>

    <h4 class="mt-4">Roster</h4>
    <p class="text-muted" th:if="${competition.roster.isEmpty()}">No animators added yet.</p>
    <ul>
        <li th:each="p : ${competition.roster}" th:text="${p.username}"></li>
    </ul>

    <script th:src="@{/js/localdate.js}"></script>
</body>
</html>
