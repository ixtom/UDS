<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Competitions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <a th:if="${currentUser != null and currentUser.hasRole('ADMIN')}"
       th:href="@{/admin/competitions/new}" class="btn btn-primary mb-3">Create new competition</a>

    <div th:each="c : ${competitions}">
        <a th:href="@{/competitions/{id}(id=${c.id})}" th:text="${c.title}"></a>
        <time class="convert-to-local-date-and-time" th:datetime="${c.start}"></time>
        <a th:if="${currentUser != null and currentUser.hasRole('ADMIN')}"
           th:href="@{/admin/competitions/{id}(id=${c.id})}">Manage</a>
    </div>

    <script th:src="@{/js/localdate.js}"></script>
</body>
</html>
