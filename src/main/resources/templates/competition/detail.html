<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competition</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <a th:href="@{/competitions}">&larr; All competitions</a>

    <h2 class="mt-3" th:text="${competition.title}"></h2>
    <p>
        <span th:text="${competition.started() ? 'Started: ' : 'Starts: '}"></span>
        <time class="convert-to-local-date-and-time"
              th:datetime="${competition.start}"></time>
    </p>
    <p>Rounds: <span th:text="${competition.rounds}"></span></p>
    <p>Max participants: <span th:text="${competition.maxParticipants}"></span></p>

    <a th:if="${canJoin}" th:href="@{/competitions/{id}/join(id=${competition.id})}" class="btn btn-primary">Join</a>

    <form th:if="${canLeave}" th:action="@{/competitions/{id}/leave(id=${competition.id})}" method="post">
        <button type="submit" class="btn btn-primary">Leave</button>
    </form>

    <h4 class="mt-4">Participants (<span th:text="${#lists.size(competition.participants)}"></span>)</h4>
    <p class="text-muted" th:if="${competition.participants.isEmpty()}">Nobody has joined yet.</p>
    <ul>
        <li th:each="p : ${competition.participants}" th:text="${p.duelist.name} + ' (' + ${p.duelist.owner.username} + ')'"></li>
    </ul>

    <script th:src="@{/js/localdate.js}"></script>
</body>
</html>
