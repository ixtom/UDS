<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
    <style>
        .navbar .nav-link { color: #6c757d; font-size: 0.9rem; }
        .navbar .nav-link:hover { color: #212529; }
        .navbar .btn-link { color: #6c757d; font-size: 0.9rem; text-decoration: none; }
        .navbar .btn-link:hover { color: #212529; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4">
        <div class="container">
            <a class="navbar-brand font-weight-normal text-dark" href="/">Home</a>

            <ul class="navbar-nav flex-row flex-wrap ml-auto align-items-center">
                <li class="nav-item px-2">
                    <a class="nav-link" th:href="@{/competitions}">Competitions</a>
                </li>

                <th:block th:if="${currentUser != null}">
                    <li class="nav-item px-2">
                        <a class="nav-link" href="/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item px-2">
                        <a class="nav-link" th:href="@{/account/profile/edit}">Edit Profile</a>
                    </li>
                    <li class="nav-item px-2">
                        <a class="nav-link" href="/change-password">Change password</a>
                    </li>
                    <li class="nav-item px-2" th:if="${!currentUser.isProviderLinked('discord')}">
                        <a class="nav-link" href="/link/discord">Link Discord</a>
                    </li>
                    <li class="nav-item px-2" th:if="${currentUser.hasRole('ADMIN')}">
                        <a class="nav-link" href="/admin/users">Registered users</a>
                    </li>
                    <li class="nav-item px-2">
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <input type="submit" value="Logout" class="btn btn-link p-0" />
                        </form>
                    </li>
                </th:block>

                <li class="nav-item px-2" th:if="${currentUser == null}">
                    <a class="nav-link" href="/login">Login</a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <h1 class="h3 mb-4 p-2">Index</h1>

        <div class="card shadow-sm">
            <div class="card-header font-weight-bold">Duels</div>
            <div class="list-group list-group-flush">
                <a th:each="duel : ${duels}"
                   class="list-group-item list-group-item-action"
                   th:href="@{/duelpage/{id}(id=${duel.id})}"
                   th:text="${duel.getDefaultTitle}"></a>
            </div>
        </div>
    </main>

</body>
</html>
