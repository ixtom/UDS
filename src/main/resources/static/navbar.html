<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:ital,opsz@0,14..32;1,14..32&display=swap');
    </style>
</head>
<body style="font-family: 'Inter', sans-serif;">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">UDS '27</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <div th:if="${currentUser != null}">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="/upload">Upload new duel</a>
        </li></div>
        <li class="nav-item">
          <a sec:authorize="hasRole('ADMIN')" class="nav-link active" aria-current="page" href="/admin/users">View registered users</a>
        </li>
      </ul>
    <div th:if="${currentUser != null}">
        <form th:action="@{/logout}" method="post">
            <input type="submit" value="logout" />
        </form>
        <a href="/change-password">Change password</a>
    </div>
    <div th:if="${currentUser != null}">
      <div class="navbar-nav">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Account
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#">Action</a></li>
            <li><a class="dropdown-item" href="#">Another action</a></li>
            <li><hr class="dropdown-divider"></li>
            <form class="dropdown-item" th:action="@{/logout}" method="post">
                <input type="submit" value="logout" />
            </form>
            <li><a class="dropdown-item" href="#">Log out</a></li>
          </ul>
        </li>
    </div>
    </div>
    
    </div>
  </div>
</nav>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
