# Test-only configuration. This file shadows src/main/resources/application.properties
# on the test classpath, so tests never use the real Postgres database or real Discord credentials.
spring.application.name=uds

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=14d

# In-memory H2 database, rebuilt for every test run
spring.datasource.url=jdbc:h2:mem:uds-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

spring.session.jdbc.initialize-schema=always

# Fake Discord client. Every endpoint is explicit (no issuer-uri) so Spring does not
# contact discord.com at startup; the .invalid domain can never resolve.
spring.security.oauth2.client.registration.discord.provider=discord
spring.security.oauth2.client.registration.discord.client-id=test-client-id
spring.security.oauth2.client.registration.discord.client-secret=test-client-secret
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.scope=identify,email
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.invalid/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.invalid/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.invalid/api/users/@me
spring.security.oauth2.client.provider.discord.user-name-attribute=id
